<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d9c6f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a7a52;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3aaf85;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#28855f;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8745a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c4543a;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#fafbfc" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a2a">Pneumonia Detection: XGBoost Meta-learner with Deep Feature Extractors</text>

  <!-- Input: Chest X-Ray -->
  <rect x="30" y="170" width="130" height="120" rx="12" fill="#eef5f0" stroke="#b0d4bf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="95" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#1a3a2a">Chest</text>
  <text x="95" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#1a3a2a">X-Ray</text>
  <text x="95" y="248" text-anchor="middle" font-size="11" fill="#5a7a6a">Input Image</text>
  <rect x="60" y="260" width="70" height="18" rx="4" fill="#d4e8dc"/>
  <text x="95" y="273" text-anchor="middle" font-size="9" fill="#2a5a3f">224×224 px</text>

  <!-- Arrow from Input to ViT -->
  <line x1="160" y1="200" x2="210" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Arrow from Input to ResNet -->
  <line x1="160" y1="260" x2="210" y2="310" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ViT Feature Extractor -->
  <rect x="220" y="100" width="170" height="100" rx="12" fill="url(#g1)" filter="url(#shadow)"/>
  <text x="305" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="white">ViT</text>
  <text x="305" y="158" text-anchor="middle" font-size="11" fill="#c8f0d8">Vision Transformer</text>
  <text x="305" y="178" text-anchor="middle" font-size="10" fill="#a0d8b8">Feature Extractor</text>

  <!-- ResNet50 Feature Extractor -->
  <rect x="220" y="270" width="170" height="100" rx="12" fill="url(#g2)" filter="url(#shadow)"/>
  <text x="305" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="white">ResNet50</text>
  <text x="305" y="328" text-anchor="middle" font-size="11" fill="#c8f0d8">Deep CNN</text>
  <text x="305" y="348" text-anchor="middle" font-size="10" fill="#a0d8b8">Feature Extractor</text>

  <!-- Arrow from ViT to Concat -->
  <line x1="390" y1="150" x2="440" y2="215" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Arrow from ResNet to Concat -->
  <line x1="390" y1="320" x2="440" y2="255" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Feature Concatenation -->
  <rect x="450" y="195" width="130" height="80" rx="12" fill="#f0f4f1" stroke="#b0d4bf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="515" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#1a3a2a">Feature</text>
  <text x="515" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#1a3a2a">Concatenation</text>

  <!-- Arrow to XGBoost -->
  <line x1="580" y1="235" x2="630" y2="235" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- XGBoost Meta-learner -->
  <rect x="640" y="175" width="140" height="120" rx="12" fill="url(#g3)" filter="url(#shadow)"/>
  <text x="710" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="white">XGBoost</text>
  <text x="710" y="240" text-anchor="middle" font-size="11" fill="#ffd8cc">Meta-learner</text>
  <text x="710" y="260" text-anchor="middle" font-size="11" fill="#ffd8cc">Classifier</text>
  <rect x="665" y="270" width="90" height="16" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="710" y="282" text-anchor="middle" font-size="9" font-weight="600" fill="white">Ensemble Model</text>

  <!-- Arrow to Output -->
  <line x1="780" y1="235" x2="810" y2="235" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Output -->
  <rect x="815" y="185" width="70" height="100" rx="10" fill="#eef5f0" stroke="#b0d4bf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="850" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#1a6a42">Normal</text>
  <text x="850" y="240" text-anchor="middle" font-size="8" fill="#5a7a6a">or</text>
  <text x="850" y="258" text-anchor="middle" font-size="11" font-weight="600" fill="#c4543a">Pneumonia</text>

  <!-- Accuracy Badge -->
  <rect x="350" y="420" width="200" height="40" rx="20" fill="#1a7a52" filter="url(#shadow)"/>
  <text x="450" y="445" text-anchor="middle" font-size="14" font-weight="700" fill="white">Accuracy: 96.19%</text>

  <!-- Label: CPAMCS 2023 -->
  <rect x="20" y="12" width="110" height="24" rx="6" fill="#2d9c6f"/>
  <text x="75" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="white">CPAMCS 2023</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>
</svg>
