<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="d1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a9c4a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="d2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a6fb0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="d3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="d4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="d5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7d3c98;stop-opacity:1"/>
    </linearGradient>
    <filter id="sd">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="ay" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#f5faf5" rx="12"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a1a">Forecasting of Crop Yield Using Various Machine Learning Approaches</text>

  <!-- Input Data -->
  <rect x="30" y="130" width="140" height="200" rx="12" fill="#e8f5e8" stroke="#b0d8b0" stroke-width="1.5" filter="url(#sd)"/>
  <text x="100" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1a4a1a">Input Data</text>
  <line x1="50" y1="170" x2="150" y2="170" stroke="#b0d8b0" stroke-width="1"/>
  <text x="100" y="192" text-anchor="middle" font-size="10" fill="#3a6a3a">🌧 Rainfall</text>
  <text x="100" y="212" text-anchor="middle" font-size="10" fill="#3a6a3a">🌡 Temperature</text>
  <text x="100" y="232" text-anchor="middle" font-size="10" fill="#3a6a3a">🧪 Pesticides</text>
  <text x="100" y="252" text-anchor="middle" font-size="10" fill="#3a6a3a">🌱 Soil Data</text>
  <text x="100" y="272" text-anchor="middle" font-size="10" fill="#3a6a3a">📊 Historical Yield</text>
  <text x="100" y="300" text-anchor="middle" font-size="9" fill="#5a8a5a">Feature Engineering</text>
  <text x="100" y="316" text-anchor="middle" font-size="9" fill="#5a8a5a">&amp; Preprocessing</text>

  <!-- Arrows from Input to Models -->
  <line x1="170" y1="180" x2="220" y2="115" stroke="#888" stroke-width="1.2" marker-end="url(#ay)"/>
  <line x1="170" y1="210" x2="220" y2="195" stroke="#888" stroke-width="1.2" marker-end="url(#ay)"/>
  <line x1="170" y1="230" x2="220" y2="275" stroke="#888" stroke-width="1.2" marker-end="url(#ay)"/>
  <line x1="170" y1="260" x2="220" y2="355" stroke="#888" stroke-width="1.2" marker-end="url(#ay)"/>

  <!-- Model 1: Random Forest -->
  <rect x="230" y="80" width="140" height="70" rx="10" fill="url(#d1)" filter="url(#sd)"/>
  <text x="300" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="white">Random Forest</text>
  <text x="300" y="128" text-anchor="middle" font-size="10" fill="#c0f0c8">Ensemble Trees</text>

  <!-- Model 2: Extra Trees -->
  <rect x="230" y="170" width="140" height="70" rx="10" fill="url(#d2)" filter="url(#sd)"/>
  <text x="300" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="white">Extra Trees</text>
  <text x="300" y="218" text-anchor="middle" font-size="10" fill="#b8d8ff">Randomized Splits</text>

  <!-- Model 3: ANN -->
  <rect x="230" y="260" width="140" height="70" rx="10" fill="url(#d3)" filter="url(#sd)"/>
  <text x="300" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="white">ANN</text>
  <text x="300" y="308" text-anchor="middle" font-size="10" fill="#ffc8c0">Neural Network</text>

  <!-- Model 4: SVR / DTR -->
  <rect x="230" y="350" width="140" height="70" rx="10" fill="url(#d4)" filter="url(#sd)"/>
  <text x="300" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="white">SVR / DTR</text>
  <text x="300" y="398" text-anchor="middle" font-size="10" fill="#ffe8b8">Regression Models</text>

  <!-- Arrows to Evaluation -->
  <line x1="370" y1="115" x2="470" y2="210" stroke="#888" stroke-width="1.2" marker-end="url(#ay)"/>
  <line x1="370" y1="205" x2="470" y2="220" stroke="#888" stroke-width="1.2" marker-end="url(#ay)"/>
  <line x1="370" y1="295" x2="470" y2="240" stroke="#888" stroke-width="1.2" marker-end="url(#ay)"/>
  <line x1="370" y1="385" x2="470" y2="250" stroke="#888" stroke-width="1.2" marker-end="url(#ay)"/>

  <!-- Evaluation -->
  <rect x="480" y="170" width="160" height="120" rx="12" fill="url(#d5)" filter="url(#sd)"/>
  <text x="560" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="white">Comparative</text>
  <text x="560" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="white">Evaluation</text>
  <line x1="500" y1="238" x2="620" y2="238" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="560" y="258" text-anchor="middle" font-size="10" fill="#e0c8f0">RMSE · MAE · R²</text>
  <text x="560" y="276" text-anchor="middle" font-size="10" fill="#e0c8f0">Cross-Validation</text>

  <!-- Arrow to Output -->
  <line x1="640" y1="230" x2="690" y2="230" stroke="#888" stroke-width="1.5" marker-end="url(#ay)"/>

  <!-- Output -->
  <rect x="700" y="155" width="180" height="150" rx="12" fill="#e8f5e8" stroke="#b0d8b0" stroke-width="1.5" filter="url(#sd)"/>
  <text x="790" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#1a4a1a">Yield Prediction</text>
  <line x1="720" y1="195" x2="860" y2="195" stroke="#b0d8b0" stroke-width="1"/>
  <text x="790" y="218" text-anchor="middle" font-size="10" fill="#3a6a3a">🌾 Crop Yield</text>
  <text x="790" y="238" text-anchor="middle" font-size="10" fill="#3a6a3a">Forecast (tons/ha)</text>
  <line x1="720" y1="252" x2="860" y2="252" stroke="#b0d8b0" stroke-width="0.5"/>
  <text x="790" y="272" text-anchor="middle" font-size="10" font-weight="600" fill="#1a9c4a">Best: Random Forest</text>
  <text x="790" y="292" text-anchor="middle" font-size="9" fill="#5a8a5a">&amp; Extra Trees</text>

  <!-- Label -->
  <rect x="20" y="10" width="190" height="24" rx="6" fill="#2ecc71"/>
  <text x="115" y="26" text-anchor="middle" font-size="10" font-weight="600" fill="white">Rural Sustainability Research 2024</text>
</svg>
