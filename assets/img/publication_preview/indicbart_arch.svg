<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="c1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d35400;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="c2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2980b9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a5276;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="c3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8e44ad;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6c3483;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="c4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e8449;stop-opacity:1"/>
    </linearGradient>
    <filter id="ds">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="aw" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#fdf8f0" rx="12"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#2a1a0a">IndicBART alongside Visual Element: Multimodal Summarization in Indian Languages</text>

  <!-- Input: Multimodal Data -->
  <rect x="20" y="120" width="130" height="80" rx="10" fill="#fef0e0" stroke="#e0c8a0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="85" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#5a3a1a">Text Input</text>
  <text x="85" y="172" text-anchor="middle" font-size="9" fill="#8a6a4a">Paragraphs</text>
  <text x="85" y="186" text-anchor="middle" font-size="9" fill="#8a6a4a">(Hindi, Tamil, Bengali, Marathi)</text>

  <rect x="20" y="280" width="130" height="80" rx="10" fill="#fef0e0" stroke="#e0c8a0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="85" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#5a3a1a">Image Input</text>
  <text x="85" y="332" text-anchor="middle" font-size="9" fill="#8a6a4a">Associated Images</text>
  <text x="85" y="346" text-anchor="middle" font-size="9" fill="#8a6a4a">from articles</text>

  <!-- Arrows to Encoders -->
  <line x1="150" y1="160" x2="200" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#aw)"/>
  <line x1="150" y1="320" x2="200" y2="320" stroke="#888" stroke-width="1.5" marker-end="url(#aw)"/>

  <!-- Text Encoder: IndicBART -->
  <rect x="210" y="110" width="160" height="100" rx="12" fill="url(#c1)" filter="url(#ds)"/>
  <text x="290" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="white">IndicBART</text>
  <text x="290" y="165" text-anchor="middle" font-size="10" fill="#ffe0b8">mBART Backbone</text>
  <text x="290" y="185" text-anchor="middle" font-size="10" fill="#ffe0b8">Text Encoder</text>

  <!-- Visual Encoder -->
  <rect x="210" y="270" width="160" height="100" rx="12" fill="url(#c2)" filter="url(#ds)"/>
  <text x="290" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="white">Visual Encoder</text>
  <text x="290" y="325" text-anchor="middle" font-size="10" fill="#b8d8ff">Pre-trained Vision</text>
  <text x="290" y="345" text-anchor="middle" font-size="10" fill="#b8d8ff">Model</text>

  <!-- Arrows to Fusion -->
  <line x1="370" y1="160" x2="430" y2="230" stroke="#888" stroke-width="1.5" marker-end="url(#aw)"/>
  <line x1="370" y1="320" x2="430" y2="250" stroke="#888" stroke-width="1.5" marker-end="url(#aw)"/>

  <!-- Visual-Aware Fusion -->
  <rect x="440" y="195" width="150" height="95" rx="12" fill="url(#c3)" filter="url(#ds)"/>
  <text x="515" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="white">Visual-Aware</text>
  <text x="515" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="white">Fusion</text>
  <text x="515" y="272" text-anchor="middle" font-size="10" fill="#d8b8ff">Cross-modal Attention</text>

  <!-- Arrow to Decoder -->
  <line x1="590" y1="242" x2="640" y2="242" stroke="#888" stroke-width="1.5" marker-end="url(#aw)"/>

  <!-- Decoder -->
  <rect x="650" y="195" width="120" height="95" rx="12" fill="url(#c4)" filter="url(#ds)"/>
  <text x="710" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="white">Decoder</text>
  <text x="710" y="248" text-anchor="middle" font-size="10" fill="#b8f0c8">Abstractive</text>
  <text x="710" y="268" text-anchor="middle" font-size="10" fill="#b8f0c8">Summarization</text>

  <!-- Arrow to Output -->
  <line x1="770" y1="242" x2="800" y2="242" stroke="#888" stroke-width="1.5" marker-end="url(#aw)"/>

  <!-- Output -->
  <rect x="808" y="200" width="80" height="85" rx="10" fill="#fef0e0" stroke="#e0c8a0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="848" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#5a3a1a">Summary</text>
  <text x="848" y="250" text-anchor="middle" font-size="9" fill="#8a6a4a">+ Selected</text>
  <text x="848" y="266" text-anchor="middle" font-size="9" fill="#8a6a4a">Images</text>

  <!-- Metrics -->
  <rect x="250" y="430" width="180" height="36" rx="18" fill="#e67e22" filter="url(#ds)"/>
  <text x="340" y="453" text-anchor="middle" font-size="12" font-weight="700" fill="white">ROUGE-1: 0.266 (Hindi)</text>

  <rect x="470" y="430" width="180" height="36" rx="18" fill="#2980b9" filter="url(#ds)"/>
  <text x="560" y="453" text-anchor="middle" font-size="12" font-weight="700" fill="white">Image Precision: 44.1%</text>

  <!-- Label -->
  <rect x="20" y="10" width="100" height="24" rx="6" fill="#e67e22"/>
  <text x="70" y="26" text-anchor="middle" font-size="10" font-weight="600" fill="white">ICDAR 2024</text>

  <!-- Language Tags -->
  <rect x="210" y="430" width="30" height="18" rx="4" fill="#8e44ad"/>
  <text x="225" y="443" text-anchor="middle" font-size="8" font-weight="600" fill="white">हिन्दी</text>
</svg>
